name: Windows client CI

on:
  push:
    paths:
      - "windows/**"
      - "MeetingWhisper/CMakeLists.txt"
      - ".gitignore"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "windows/**"
      - "MeetingWhisper/CMakeLists.txt"
      - ".gitignore"
      - ".github/workflows/windows-ci.yml"
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Parse Windows build scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem windows/scripts -Filter '*.ps1' -File
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell syntax errors found in $($file.Name)."
            }
          }

      - name: Build portable Windows core
        run: dotnet build windows/src/TranscribeToText.Core/TranscribeToText.Core.csproj -c Release

      - name: Run core compatibility checks
        run: dotnet run --project windows/tests/TranscribeToText.Core.Tests/TranscribeToText.Core.Tests.csproj -c Release

      - name: Build WinUI client
        run: dotnet build windows/src/TranscribeToText.App/TranscribeToText.App.csproj -c Release -p:Platform=x64
